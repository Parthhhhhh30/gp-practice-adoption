name: vercel-web-checks
on:
  push:
    paths:
      - "web/**"
      - ".github/workflows/vercel-web-checks.yml"
  pull_request:
    paths:
      - "web/**"
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt pytest httpx
      - run: python -m compileall -q .
      - run: python -m pytest -q tests
